<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Packer</title>
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1>Packer</h1>
          <p class="brand-sub">파일을 묶어 암호화하고, 다시 풀어냅니다</p>
        </div>
      </div>
      <nav class="tabs" role="tablist" aria-label="작업 선택">
        <button type="button" class="tab" data-pk="tab" data-tab="pack" role="tab" aria-selected="true">
          묶기
        </button>
        <button type="button" class="tab" data-pk="tab" data-tab="unpack" role="tab" aria-selected="false">
          풀기
        </button>
      </nav>
    </header>

    <main>
      <!-- ------------------------------------------------------------ 묶기 -->
      <section class="panel" data-pk="panel" data-tab="pack" role="tabpanel" aria-label="묶기">
        <!--
          무엇을 묶을지부터 고르게 한다. 두 갈래는 담는 것이 다를 뿐 뒤의 파이프라인은 같다 —
          키 입력부터 아래는 두 모드가 그대로 공유한다.
        -->
        <nav class="subtabs" data-pk="pack-input-tabs" role="tablist" aria-label="묶을 대상 고르기">
          <button
            type="button"
            class="subtab"
            data-pk="pack-input-tab"
            data-input="files"
            role="tab"
            aria-selected="true"
          >
            파일 선택
          </button>
          <button
            type="button"
            class="subtab"
            data-pk="pack-input-tab"
            data-input="text"
            role="tab"
            aria-selected="false"
          >
            텍스트 입력
          </button>
        </nav>

        <div data-pk="pack-input-panel" data-input="files" role="tabpanel" aria-label="파일 선택">
          <div class="dropzone" data-pk="pack-dropzone">
            <p class="dropzone-title">여기로 파일이나 폴더를 끌어다 놓으세요</p>
            <p class="dropzone-sub">폴더를 놓으면 안에 있는 파일까지 모두 담습니다</p>
            <div class="dropzone-actions">
              <button type="button" class="btn btn-ghost" data-pk="pack-add-files">파일 선택</button>
              <button type="button" class="btn btn-ghost" data-pk="pack-add-folders">폴더 선택</button>
            </div>
          </div>

          <div class="list-head">
            <span class="list-summary tnum" data-pk="pack-summary"></span>
            <button type="button" class="btn btn-quiet" data-pk="pack-clear">모두 비우기</button>
          </div>
          <p class="empty" data-pk="pack-empty">아직 담긴 항목이 없습니다.</p>
          <div class="list" data-pk="pack-list"></div>
        </div>

        <!--
          텍스트 입력 모드. 여기 친 글은 **임시 파일을 거치지 않고** 그대로 묶인다
          (`archive::scan_text`). 평문을 디스크에 한 번 떨어뜨렸다 지우는 것은, 지운 자리를
          덮어쓰지 못하므로 이 앱이 없애려는 노출을 스스로 만드는 일이다.
        -->
        <div data-pk="pack-input-panel" data-input="text" role="tabpanel" aria-label="텍스트 입력" hidden>
          <div class="field">
            <label class="field-label" for="pack-text-name-input">묶을 때 쓸 파일 이름</label>
            <input
              class="input"
              id="pack-text-name-input"
              data-pk="pack-text-name"
              type="text"
              autocomplete="off"
              spellcheck="false"
              placeholder="메모.txt"
            />
            <p class="hint">풀어내면 이 이름의 파일 하나가 나옵니다. 비워 두면 <code>메모.txt</code> 입니다.</p>
          </div>

          <div class="output">
            <div class="output-head">
              <span class="field-label">묶을 텍스트</span>
              <span class="list-summary tnum" data-pk="pack-text-count"></span>
            </div>
            <textarea
              class="textarea"
              data-pk="pack-text"
              spellcheck="false"
              placeholder="여기에 붙여넣거나 바로 적으세요. 적은 글은 파일로 저장되지 않고 그대로 암호화됩니다."
              aria-label="묶을 텍스트"
            ></textarea>
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="pack-key-input">암호화 키</label>
          <div class="key-row">
            <input
              class="input"
              id="pack-key-input"
              data-pk="pack-key"
              type="password"
              placeholder="풀 때 필요한 키를 입력하세요"
            />
            <button type="button" class="btn btn-ghost" data-pk="pack-key-toggle">보기</button>
          </div>
          <p class="strength" data-pk="pack-key-strength" hidden></p>
        </div>

        <button type="button" class="btn btn-primary btn-block" data-pk="pack-submit">
          묶고 암호화하기
        </button>

        <div class="progress" data-pk="pack-progress" hidden>
          <div class="progress-track"><div class="progress-fill" data-pk="pack-progress-fill"></div></div>
          <p class="progress-label tnum" data-pk="pack-progress-label"></p>
        </div>

        <p class="status" data-pk="pack-status" hidden></p>

        <!--
          결과를 어떻게 옮길지 고르는 자리.

          묶기 **전에** 저장 위치를 묻지 않는 이유가 여기 있다. 텍스트로 부칠지 QR 로 비출지는
          결과가 얼마나 큰지를 알아야 정할 수 있고, 그 크기는 묶어 봐야 나온다. 그래서 결과는
          먼저 임시 폴더에 앉고(`commands::PackedSlot`), 저장은 아래 텍스트 탭에서 사람이
          고를 때 일어난다.
        -->
        <div class="result" data-pk="pack-result" hidden>
          <nav class="subtabs" data-pk="pack-result-tabs" role="tablist" aria-label="결과 옮기는 방법">
            <button
              type="button"
              class="subtab"
              data-pk="pack-result-tab"
              data-result="text"
              role="tab"
              aria-selected="true"
            >
              텍스트로 보기
            </button>
            <button
              type="button"
              class="subtab"
              data-pk="pack-result-tab"
              data-result="qr"
              role="tab"
              aria-selected="false"
            >
              QR 코드
            </button>
          </nav>

          <div data-pk="pack-result-panel" data-result="text" role="tabpanel" aria-label="텍스트로 보기">
            <div class="output" data-pk="pack-output" hidden>
              <div class="output-head">
                <span class="field-label">묶은 결과 (텍스트)</span>
                <div class="output-actions">
                  <button type="button" class="btn btn-ghost" data-pk="pack-output-copy">
                    전체 복사
                  </button>
                  <button type="button" class="btn btn-primary" data-pk="pack-save">
                    파일로 저장
                  </button>
                </div>
              </div>
              <textarea
                class="textarea"
                data-pk="pack-output-text"
                readonly
                spellcheck="false"
                aria-label="묶은 결과 텍스트"
              ></textarea>
              <p class="hint tnum" data-pk="pack-output-note"></p>
              <p class="hint tnum" data-pk="pack-save-note"></p>
              <button type="button" class="btn btn-ghost" data-pk="pack-reveal" hidden>
                탐색기에서 보기
              </button>
            </div>
          </div>

          <div data-pk="pack-result-panel" data-result="qr" role="tabpanel" aria-label="QR 코드" hidden>
        <div class="qr" data-pk="pack-qr" hidden>
          <div class="output-head">
            <span class="field-label">QR 코드 (휴대폰으로 스캔)</span>
            <div class="qr-nav" data-pk="pack-qr-nav" role="group" aria-label="QR 코드 넘기기" hidden>
              <!--
                자동 넘김. 한 바퀴 돌고 마지막 장에서 멈춘다 — '다음' 이 잠기는 것이 "다 찍었다"
                는 유일한 신호라서, 무한히 돌면 그 신호가 사라진다.
              -->
              <button type="button" class="btn btn-quiet" data-pk="pack-qr-play" aria-pressed="false">
                자동 넘김
              </button>
              <label class="qr-speed">
                <span class="sr-only">넘김 속도</span>
                <!--
                  하한 300ms: ML Kit 이 심볼 하나를 안정적으로 잡는 시간이자, 화면을 채운
                  고대비 그림이 초당 3회를 넘겨 바뀌지 않게 하는 선이다 (WCAG 2.3.1).
                -->
                <input
                  type="range"
                  data-pk="pack-qr-speed"
                  min="300"
                  max="1500"
                  step="50"
                  value="350"
                />
                <span class="qr-speed-label tnum" data-pk="pack-qr-speed-label">350ms</span>
              </label>
              <button type="button" class="btn btn-quiet" data-pk="pack-qr-prev">이전</button>
              <span
                class="qr-index tnum"
                data-pk="pack-qr-index"
                aria-live="polite"
                aria-atomic="true"
              ></span>
              <button type="button" class="btn btn-quiet" data-pk="pack-qr-next">다음</button>
            </div>
          </div>
          <div class="qr-frame">
            <img
              class="qr-image"
              data-pk="pack-qr-image"
              alt="묶은 결과 텍스트를 담은 QR 코드"
              draggable="false"
              hidden
            />
          </div>

          <!--
            스트림 타일 판. 조각 모드의 그림판(위)과 자리를 나눠 쓰지 않는다 — 한쪽은 한 장을
            갈아 끼우고 다른 쪽은 여러 장을 동시에 세우므로, 같은 <img> 를 돌려 쓰면 배율 계산이
            두 모드에서 서로를 덮어쓴다. 타일은 main.js 가 개수에 맞춰 만들어 넣는다.
          -->
          <div class="qr-frame qr-stream-frame" data-pk="pack-qr-stream-frame" hidden>
            <div class="qr-tile-grid" data-pk="pack-qr-stream-grid"></div>
          </div>

          <!--
            놓친 장 부르기. 폰이 "남은 순번 3, 7, 12~15" 라고 알려 주면 그 글자를 그대로 넣어
            그 장들만 불러낸다 — 한 바퀴를 통째로 다시 돌지 않아도 된다.
            여러 장을 넣으면 그 목록만 되풀이해 돈다 (main.js 의 applyQrGoto 참고).
          -->
          <div class="qr-jump" data-pk="pack-qr-jump" hidden>
            <label class="sr-only" for="pack-qr-goto">놓친 장 번호</label>
            <input
              class="input"
              id="pack-qr-goto"
              data-pk="pack-qr-goto"
              type="text"
              autocomplete="off"
              spellcheck="false"
              placeholder="놓친 장 번호 (예: 3, 7, 12~15)"
            />
            <button type="button" class="btn btn-quiet" data-pk="pack-qr-goto-go">그 장 보기</button>
            <button type="button" class="btn btn-quiet" data-pk="pack-qr-goto-clear" hidden>
              전체로 돌아가기
            </button>
          </div>
          <p class="qr-note qr-jump-note tnum" data-pk="pack-qr-goto-note"></p>

          <p class="qr-note tnum" data-pk="pack-qr-note"></p>

          <!--
            스트림 모드. 조각 모드에 담기지 않는 크기일 때만 나온다.
            이 QR 은 기본 카메라로 찍어 붙여넣을 수 없다 — 그 사실을 감추지 않는다.
          -->
          <div class="qr-stream" data-pk="pack-qr-stream" hidden>
            <button type="button" class="btn btn-quiet" data-pk="pack-qr-stream-start">
              스트림으로 보내기
            </button>

            <!--
              스트림 전용 속도. 조각 모드의 슬라이더(pack-qr-speed)는 .qr-nav 안에 있어서 이
              모드에서는 아예 뜨지 않는다 — 끝이 없는 스트림에 '이전·다음' 이 없기 때문이다.
              그래서 여기 하나를 따로 둔다.
            -->
            <div class="qr-stream-tune">
              <label class="qr-speed">
                <span class="sr-only">프레임 넘김 속도</span>
                <input
                  type="range"
                  data-pk="pack-qr-stream-speed"
                  min="300"
                  max="1500"
                  step="50"
                  value="350"
                />
                <span class="qr-speed-label tnum" data-pk="pack-qr-stream-speed-label">350ms</span>
              </label>
              <!--
                빠른 구간은 **켜야 열린다.** 스트림은 한 프레임을 놓쳐도 다음 프레임이 대신하므로
                조각 모드보다 훨씬 빨리 넘겨도 되지만, 초당 3회를 넘겨 바뀌는 고대비 그림은
                WCAG 2.3.1 이 경고하는 구간이다. 그 선을 넘는 것은 사람이 알고 넘어야 한다.
              -->
              <label class="qr-fast">
                <input type="checkbox" data-pk="pack-qr-stream-fast" />
                <span>빠르게 보내기</span>
              </label>

              <!--
                한 화면에 몇 장을 세울지. 카메라 프레임은 16:9 인데 QR 은 정사각형이라 한 장만
                띄우면 좌우가 통째로 논다 — 두 장을 나란히 세우면 심볼 한 변이 11% 작아지는
                대신 한 번에 두 프레임이 들어간다.

                넘김 **횟수**는 그대로다. 그래서 속도를 올리는 것과 달리 롤링 셔터가 찢는 비율도,
                초당 몇 번 바뀌는지(WCAG 2.3.1)도 늘지 않는다.
              -->
              <fieldset class="qr-tiles">
                <legend class="sr-only">한 화면에 띄울 QR 수</legend>
                <label class="qr-tile-choice">
                  <input type="radio" name="pack-qr-tiles" data-pk="pack-qr-tile" value="1" />
                  <span>1장</span>
                </label>
                <label class="qr-tile-choice">
                  <input type="radio" name="pack-qr-tiles" data-pk="pack-qr-tile" value="2" checked />
                  <span>2장</span>
                </label>
                <label class="qr-tile-choice">
                  <input type="radio" name="pack-qr-tiles" data-pk="pack-qr-tile" value="4" />
                  <span>4장</span>
                </label>
              </fieldset>
            </div>
            <p class="qr-note qr-jump-note tnum" data-pk="pack-qr-tiles-note"></p>
            <p class="qr-note qr-jump-note tnum" data-pk="pack-qr-stream-fast-note"></p>

            <p class="qr-note tnum" data-pk="pack-qr-stream-note"></p>
          </div>
        </div>
          </div>
        </div>
      </section>

      <!-- ------------------------------------------------------------ 풀기 -->
      <section class="panel" data-pk="panel" data-tab="unpack" role="tabpanel" aria-label="풀기" hidden>
        <div class="dropzone" data-pk="unpack-dropzone">
          <p class="dropzone-title">묶어 둔 텍스트 파일을 끌어다 놓으세요</p>
          <p class="dropzone-sub">키 없이도 어떤 방식으로 묶였는지 먼저 확인합니다</p>
          <div class="dropzone-actions">
            <button type="button" class="btn btn-ghost" data-pk="unpack-pick">파일 선택</button>
          </div>
        </div>

        <div class="or-divider"><span>또는 텍스트를 붙여넣기</span></div>

        <div class="output">
          <div class="output-head">
            <span class="field-label">받은 텍스트</span>
            <button type="button" class="btn btn-quiet" data-pk="unpack-text-clear">비우기</button>
          </div>
          <textarea
            class="textarea"
            data-pk="unpack-text"
            spellcheck="false"
            placeholder="-----BEGIN PACKER CONTAINER----- 로 시작하는 텍스트를 붙여넣으세요"
            aria-label="풀어낼 텍스트"
          ></textarea>
        </div>

        <div class="card" data-pk="unpack-file" hidden>
          <p class="card-title" data-pk="unpack-file-name"></p>
          <p class="card-meta tnum" data-pk="unpack-file-meta"></p>
        </div>
        <p class="hint" data-pk="unpack-source-note" hidden></p>

        <div class="field">
          <label class="field-label" for="unpack-key-input">암호화 키</label>
          <div class="key-row">
            <input
              class="input"
              id="unpack-key-input"
              data-pk="unpack-key"
              type="password"
              placeholder="묶을 때 사용한 키"
            />
            <button type="button" class="btn btn-ghost" data-pk="unpack-key-toggle">보기</button>
          </div>
          <p class="hint" data-pk="unpack-key-hint" hidden>방금 묶을 때 쓴 키를 그대로 채웠습니다.</p>
        </div>

        <div class="field">
          <label class="field-label" for="unpack-dest-input">풀어낼 위치</label>
          <div class="key-row">
            <input
              class="input"
              id="unpack-dest-input"
              data-pk="unpack-dest"
              type="text"
              placeholder="파일을 모아 둘 폴더"
            />
            <button type="button" class="btn btn-ghost" data-pk="unpack-dest-pick">폴더 선택</button>
          </div>
        </div>

        <button type="button" class="btn btn-primary btn-block" data-pk="unpack-submit">
          풀고 복호화하기
        </button>

        <div class="progress" data-pk="unpack-progress" hidden>
          <div class="progress-track"><div class="progress-fill" data-pk="unpack-progress-fill"></div></div>
          <p class="progress-label tnum" data-pk="unpack-progress-label"></p>
        </div>

        <p class="status" data-pk="unpack-status" hidden></p>
        <button type="button" class="btn btn-ghost" data-pk="unpack-reveal" hidden>탐색기에서 보기</button>
      </section>
    </main>

    <template data-pk="row-template">
      <div class="row">
        <span class="row-name" data-field="name"></span>
        <span class="row-meta tnum" data-field="meta"></span>
        <button type="button" class="row-remove" data-pk="row-remove" aria-label="목록에서 제거">
          &times;
        </button>
      </div>
    </template>

    <script src="./main.js"></script>
  </body>
</html>
